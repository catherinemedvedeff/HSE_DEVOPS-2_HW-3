global:
  scrape_interval: 15s        # как часто опрашивать цели
  evaluation_interval: 15s    # как часто вычислять правила

scrape_configs:
  - job_name: prometheus            # метрики самого Prometheus
    static_configs:
      - targets: [localhost:9090]

  # TODO: добавьте задание job_name: node для своих node_exporter.
  # Node Exporter из compose.yaml работает в сети хоста, поэтому из контейнера
  # Prometheus он виден как host.docker.internal:9100.
  # Каждой цели задайте понятную метку instance (vm1, vm2, ...).
